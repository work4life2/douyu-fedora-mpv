[package]
name = "douyu"
version = "0.1.0"
edition = "2021"
description = "斗鱼直播客户端 —— 原生、低开销、点一下就看"

[[bin]]
name = "douyu"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rquickjs = "0.9"
tungstenite = { version = "0.24", features = ["native-tls"] }
native-tls = "0.2"
eframe = "0.29"
libloading = "0.8"
qrcode = "0.14"
png = "0.17"

[profile.release]
# 之前用 opt-level="z"（体积优先）：它会关掉循环向量化和内联，而本项目的热路径
# 恰好全是逐字节/逐像素循环（FLV 解析、弹幕字段查找、颜色转换、egui tessellation）。
# 体积只差 1~2MB，换这些循环 20~50% 的速度，不划算。
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true        # 去掉符号
panic = "abort"     # 去掉 unwind 开销
