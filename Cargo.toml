[package]
name = "douyu"
version = "0.1.0"
edition = "2021"
description = "斗鱼直播客户端 —— 原生、低开销、点一下就看"

[[bin]]
name = "douyu"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rquickjs = "0.9"
tungstenite = { version = "0.24", features = ["native-tls"] }
native-tls = "0.2"
eframe = "0.29"
libloading = "0.8"
qrcode = "0.14"
png = "0.17"

[profile.release]
opt-level = "z"     # 体积优先
lto = true          # 链接期优化，进一步减小体积
strip = true        # 去掉符号
panic = "abort"     # 去掉 unwind 开销
